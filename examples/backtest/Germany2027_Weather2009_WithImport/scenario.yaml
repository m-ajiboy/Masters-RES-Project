Metadata:
  runId: "Germany2027_Weather2009_WithImport"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027, combining two experiments on top of the V2/with-import baseline (Germany2027_WithImport_Fix): (1) the calibrated 30,000 MW flat import ceiling (see build_2027_import_fix.py, build_2027_import_moderate.py) and (2) the Weather2009 experiment - wind onshore, wind offshore, and both solar profiles rebuilt from real 2009 weather-year data pulled from renewables.ninja (MERRA-2 reanalysis), averaged across representative regional points and redated to 2027 (see fetch_2009_renewables_ninja.py, build_2027_weather2009_profiles.py), testing whether aligning AMIRIS's renewable weather-year with Brainpool's own (reportedly 2009-based) weather assumption improves correlation. On its own (no-import), Weather2009 improved correlation with Brainpool (0.327 -> 0.414) but worsened shortage hours (7.52% -> 11.21%) since there was no import to absorb the added scarcity - this build tests whether combining it with the calibrated import ceiling fixes that shortage increase while keeping the correlation gain. Run-of-river is NOT rebuilt (renewables.ninja has no hydro data) - stays as AMIRIS's own reused profile. Demand V2 and all other inputs are otherwise identical to Germany2027_WithImport_Fix."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

Schema: !include "schema.yaml"

GeneralProperties:
  RunId: 1
  Simulation:
    StartTime: 2026-12-31_23:58:00
    StopTime: 2027-12-31_23:58:00
    RandomSeed: 1

Agents: !include ["agents/*.yaml", "Agents"]

Contracts: !include ["contracts/*.yaml", "Contracts"]

