Metadata:
  runId: "Germany2027_Demand2016Base"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027, built on top of Germany2027_ImportBlended. 2016-BASE DEMAND EXPERIMENT: the inflexible-base demand component (604.85 of 656.32 TWh, ~92% of total demand) previously rescaled real 2023 German load data. A direct comparison of real hourly temperature for every year we have real German demand data for (2015-2019, 2023) against real 2009 (Brainpool's own confirmed weather-year basis) found 2023 was the WORST weather match of all six candidates (monthly-pattern RMSE 3.37C, heating-degree-day deficit -508), while 2016 was the closest match (RMSE 2.31C, HDD deficit only -40) - see fetch_candidate_years_temperature.py, compare_candidate_years_to_2009.py. 2016 is also a structurally 'normal' pre-COVID, pre-energy-crisis year, unlike 2023. This build rescales real 2016 German load data (examples/backtest/Germany2016/timeseries/load.csv, AMIRIS's own historical example) instead - see build_2027_demand_v2_2016base.py. A genuine coincidence: both 2016-01-01 and 2027-01-01 are Fridays, so no weekday shift was needed at all (unlike the 2023 source, which needed a 5-day shift). One pre-existing gap in AMIRIS's own 2016 file (Dec 31 2016 entirely missing) was filled with a nearest-neighbour copy of Dec 30 2016, documented in the build script. Heat pumps (real 2009 temperature), electrolysis, e-mobility, the 30,000 MW import ceiling, and the 11-country blended import price are all unchanged from Germany2027_ImportBlended."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

