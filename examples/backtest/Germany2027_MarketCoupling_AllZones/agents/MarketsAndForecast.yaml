Agents:
  #############################################
  # Zone DE (Germany) - now coupled to all 10 real neighbours as separate zones (Phase 43),
  # replacing the aggregate ROE zone entirely. Each capacity is that one border's own real
  # 98th-percentile-of-2023-flow estimate (Phase 36 methodology, applied per-border instead
  # of summed into one aggregate) - except SE (Baltic Cable's real 600 MW nameplate capacity,
  # since Phase 35's SE_4 flow data was never obtained).
  #############################################
  - Type: DayAheadMarketMultiZone
    Id: 1
    Attributes:
      Clearing: &clearingParameters
        DistributionMethod: SAME_SHARES
      GateClosureInfoOffsetInSeconds: 31
      MarketZone: DE
      Transmission:
        - MarketZone: FR
          CapacityInMW: "./timeseries/transfer_DEtoFR_realflow.csv"
        - MarketZone: AT
          CapacityInMW: "./timeseries/transfer_DEtoAT_realflow.csv"
        - MarketZone: BE
          CapacityInMW: "./timeseries/transfer_DEtoBE_realflow.csv"
        - MarketZone: CZ
          CapacityInMW: "./timeseries/transfer_DEtoCZ_realflow.csv"
        - MarketZone: DK
          CapacityInMW: "./timeseries/transfer_DEtoDK_realflow.csv"
        - MarketZone: 'NO'
          CapacityInMW: "./timeseries/transfer_DEtoNO_realflow.csv"
        - MarketZone: NL
          CapacityInMW: "./timeseries/transfer_DEtoNL_realflow.csv"
        - MarketZone: PL
          CapacityInMW: "./timeseries/transfer_DEtoPL_realflow.csv"
        - MarketZone: SE
          CapacityInMW: "./timeseries/transfer_DEtoSE_realflow.csv"
        - MarketZone: CH
          CapacityInMW: "./timeseries/transfer_DEtoCH_realflow.csv"

  - Type: CarbonMarket
    Id: 3
    Attributes:
      OperationMode: FIXED
      Co2Prices: "./timeseries/co2_price.csv"

  # Sources: LIGNITE and NUCLEAR fuel costs are AMIRIS's own flat estimates (Nuclear is moot
  # for DE - 0 GW capacity). Hard coal / natural gas / oil: built from Brainpool's
  # Variable_cost sheet with unit conversions - see build_2027_timeseries.py.
  - Type: FuelsMarket
    Id: 4
    Attributes:
      FuelPrices:
        - FuelType: LIGNITE
          Price: 5.00
          ConversionFactor: 1.0
        - FuelType: HARD_COAL
          Price: "./timeseries/hard_coal_price.csv"
          ConversionFactor: 1.0
        - FuelType: NATURAL_GAS
          Price: "./timeseries/natural_gas_price.csv"
          ConversionFactor: 1.0
        - FuelType: OIL
          Price: "./timeseries/oil_price.csv"
          ConversionFactor: 1.0

  - Type: SensitivityForecaster
    Id: 6
    Attributes:
      Clearing: *clearingParameters
      ForecastPeriodInHours: 730
      MultiplierEstimation:
        InitialEstimateWeight: 6
        DecayInterval: 168

  #############################################
  # Zone NL (Netherlands) - Phase 43. Reuses the Id block (9001/9004/9006) freed up when the
  # aggregate ROE zone was fully disaggregated into named zones this phase.
  #############################################
  - Type: DayAheadMarketMultiZone
    Id: 9001
    Attributes:
      Clearing:
        DistributionMethod: SAME_SHARES
      GateClosureInfoOffsetInSeconds: 31
      MarketZone: NL
      Transmission:
        - MarketZone: DE
          CapacityInMW: "./timeseries/transfer_NLtoDE_realflow.csv"

  - Type: FuelsMarket
    Id: 9004
    Attributes:
      FuelPrices:
        - FuelType: NUCLEAR
          Price: 5.00
          ConversionFactor: 1.0
        - FuelType: HARD_COAL
          Price: "./timeseries/hard_coal_price_restofeurope_2027.csv"
          ConversionFactor: 1.0
        - FuelType: NATURAL_GAS
          Price: "./timeseries/natural_gas_price_restofeurope_2027.csv"
          ConversionFactor: 1.0
        - FuelType: OIL
          Price: "./timeseries/oil_price_restofeurope_2027.csv"
          ConversionFactor: 1.0

  - Type: SensitivityForecaster
    Id: 9006
    Attributes:
      Clearing:
        DistributionMethod: SAME_SHARES
      ForecastPeriodInHours: 730
      MultiplierEstimation:
        InitialEstimateWeight: 6
        DecayInterval: 168

  #############################################
  # Zone FR (France) - new, Phase 42 pilot
  #############################################
  # Star topology: FR trades only with DE, not directly with ROE (no real cross-border data
  # was fetched for FR<->ROE-country borders specifically - a documented simplification, the
  # one topology limitation of this pilot; in reality France also trades with several ROE-9
  # countries directly, e.g. Belgium, Switzerland).
  - Type: DayAheadMarketMultiZone
    Id: 8001
    Attributes:
      Clearing:
        DistributionMethod: SAME_SHARES
      GateClosureInfoOffsetInSeconds: 31
      MarketZone: FR
      Transmission:
        - MarketZone: DE
          CapacityInMW: "./timeseries/transfer_FRtoDE_realflow.csv"

  # France's own fuel prices - HARD_COAL/NATURAL_GAS/OIL reused directly from DE's own real
  # series (internationally traded commodities, same precedent as ROE). NUCLEAR reused from
  # the same real 2023 NEI/EUCG figure already used for the ROE aggregate (~4.90 EUR/MWh,
  # rounded to a flat 5.0) - genuinely relevant here, since France's nuclear fleet (61,400 MW)
  # is the single largest generation source in this whole pilot.
  - Type: FuelsMarket
    Id: 8004
    Attributes:
      FuelPrices:
        - FuelType: NUCLEAR
          Price: 5.00
          ConversionFactor: 1.0
        - FuelType: HARD_COAL
          Price: "./timeseries/hard_coal_price_restofeurope_2027.csv"
          ConversionFactor: 1.0
        - FuelType: NATURAL_GAS
          Price: "./timeseries/natural_gas_price_restofeurope_2027.csv"
          ConversionFactor: 1.0
        - FuelType: OIL
          Price: "./timeseries/oil_price_restofeurope_2027.csv"
          ConversionFactor: 1.0

  # France's own dedicated SensitivityForecaster - required for the same reason as ROE's
  # (Phase 37): a forecaster cannot serve two zones' storage agents at once (each zone's
  # storage contract broadcasts GateClosureInfo straight to its forecaster). Mirrors DE's
  # (Id 6) and ROE's (Id 9006) forecasters exactly, as a third dedicated instance.
  - Type: SensitivityForecaster
    Id: 8006
    Attributes:
      Clearing:
        DistributionMethod: SAME_SHARES
      ForecastPeriodInHours: 730
      MultiplierEstimation:
        InitialEstimateWeight: 6
        DecayInterval: 168

