  - Type: PredefinedPlantBuilder
    Id: 3102
    Attributes:
      PortfolioBuildingOffsetInSeconds: *portfolioBuildingOffset
      Prototype:
        FuelType: NATURAL_GAS
        SpecificCo2EmissionsInTperMWH: 0.202
        OutageFactor: 0.05
        OpexVarInEURperMWH: 1.2
        CyclingCostInEURperMW: 0.0
      Efficiency:
        Minimal: 0.516
        Maximal: 0.617
      BlockSizeInMW: 200.0
      InstalledPowerInMW: 4562.139

  - Type: PredefinedPlantBuilder
    Id: 3103
    Attributes:
      PortfolioBuildingOffsetInSeconds: *portfolioBuildingOffset
      Prototype:
        FuelType: OIL
        SpecificCo2EmissionsInTperMWH: 0.266
        OutageFactor: 0.07
        OpexVarInEURperMWH: 1.2
        CyclingCostInEURperMW: 0.0
      Efficiency:
        Minimal: 0.311
        Maximal: 0.397
      BlockSizeInMW: 100.0
      InstalledPowerInMW: 498.514

  - Type: ConventionalTrader # NATURAL_GAS (AT)
    Id: 3202
    Attributes:
      minMarkup: -10
      maxMarkup: 10

  - Type: ConventionalTrader # OIL (AT)
    Id: 3203
    Attributes:
      minMarkup: 0
      maxMarkup: 0

  - Type: ConventionalPlantOperator # NATURAL_GAS (AT)
    Id: 3302

  - Type: ConventionalPlantOperator # OIL (AT)
    Id: 3303
