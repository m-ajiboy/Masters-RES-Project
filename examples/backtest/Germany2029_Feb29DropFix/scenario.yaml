Metadata:
  runId: "Germany2029_Feb29DropFix"
  description: "AMIRIS scenario for German day-ahead electricity market in 2029 - a BUG-FIX build, built on top of Germany2029. Same fix as Germany2027_Feb29DropFix: the 2016-base demand source's weekday alignment was silently broken for 84% of the year (March 1 onward) because dropping Feb-29-2016 (mid-array) creates a 2-real-day gap, shifting everything after it one weekday off. FIX: drop Dec 31 instead of Feb 29 (same technique already used successfully by Germany2028, for an unrelated reason). The existing 3-day weekday shift (2016-01-01 Fri -> 2016-01-04 Mon matches 2029-01-01 Mon) remains correct and now genuinely holds for the whole year - verified directly against the raw 2016 source's real weekday pattern. Only the inflexible-base demand component changes; heat pumps, electrolysis, e-mobility, the 30,000 MW import ceiling, and every other mechanism are unchanged from Germany2029. See build_demand_feb29fix.py, build_combined_feb29fix.py."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

