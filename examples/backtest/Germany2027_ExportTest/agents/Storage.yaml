  # EXPERIMENTAL: virtual export sink - AMIRIS has no dedicated ExportTrader agent type
  # (confirmed by checking schema.yaml). Modelled as a one-way GenericFlexibilityTrader
  # that only ever charges (draws power from the German market) and never discharges,
  # following the real pattern used by AMIRIS's own SectorCoupling demo for one-way
  # "Heat Pump" and "Load Shifting" devices (NetDischargingPowerInMW: 0). Represents
  # surplus domestic power leaving the system permanently via cross-border export, mirroring
  # the calibrated 30,000 MW import ceiling as a symmetric first-pass assumption for export
  # capacity. EnergyContentUpperLimitInMWH is set to GrossChargingPowerInMW*8760 (the most
  # it could possibly draw if charging at full power every hour of the year) purely so the
  # capacity constraint is never actually binding - only the hourly MW rate matters.
  # UNVALIDATED: whether AMIRIS's MIN_SYSTEM_COST assessment gives a one-way, never-
  # discharging device any real incentive to charge at all (vs. sitting permanently idle)
  # is untested - to be checked directly against simulation output, not assumed.
  - Attributes:
      Assessment:
        Type: MIN_SYSTEM_COST
      Bidding:
        SchedulingHorizonInHours: 24
        Type: ENSURE_DISPATCH
      Device:
        ChargingEfficiency: 1.0
        DischargingEfficiency: 1.0
        EnergyContentUpperLimitInMWH: 262800000
        GrossChargingPowerInMW: 30000.00
        InitialEnergyContentInMWH: 0
        NetDischargingPowerInMW: 0
        VariableCostInEURperMWH: 0
      StateDiscretisation:
        EnergyResolutionInMWH: 6570000
        PlanningHorizonInHours: 168
        Type: STATE_OF_CHARGE
    Id: 703
    Type: GenericFlexibilityTrader
