Metadata:
  runId: "Germany2029_MarketCoupling_ROEFlex_ScaledTransmission"
  description: "AMIRIS scenario for German day-ahead electricity market in 2029 - Phase 39, testing whether SCALING the DE<->ROE transmission capacity by DE's own real demand growth recovers 2027-level shortage-hour counts. Built on top of Germany2029_MarketCoupling_ROEFlex (Phase 38), changing ONLY the transmission-capacity timeseries - every other mechanism is identical. Phase 38 verified directly that the escalating shortage-hour count (7 in 2027, 17 in 2028, 76 in 2029) is explained by the transmission link's capacity shrinking as a share of DE's own real peak demand each year (21.75% to 20.80% to 19.88%), since the link was left at a flat, frozen MW value while DE's own demand genuinely grows. This build scales the transmission capacity by DE's own real peak-demand growth ratio (2029/2027 = 1.09404) to restore the SAME 21.75% ratio Phase 37 had: 23,623.7 MW (DE->ROE, was 21,593.0) and 24,082.1 MW (ROE->DE, was 22,012.0). A narrow, single-variable test of the verified mechanism - ROE's own demand/capacity remains frozen (no real data exists to justify scaling ROE's own economy, only DE's growth is real/sourced from Brainpool). See build_scaled_transmission.py. Germany2029_MarketCoupling_ROEFlex (Phase 38, unscaled) and Germany2029_Feb29DropFix (pre-coupling baseline) are both kept fully unmodified for comparison."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

