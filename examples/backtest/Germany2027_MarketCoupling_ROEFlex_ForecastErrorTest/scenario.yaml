Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex_ForecastErrorTest"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - an EXPLORATORY SENSITIVITY TEST on top of the standing-best Germany2027_MarketCoupling_ROEFlex (Phase 37), changing exactly ONE thing: ForecastError added to both DE's and ROE's RenewableTrader (Mean 0.0, StandardDeviation 0.03), never used in any prior build. Confirmed directly in AMIRIS's own source (AggregatorTrader.java, PowerForecastError.java): this perturbs the actual power quantity offered into the real market each hour, simulating real day-ahead wind/solar forecast error - a genuine, well-documented real-world phenomenon. StandardDeviation of 3% is a real, sourced anchor (IEA-reported day-ahead wind forecast MAE of ~3% of installed capacity for Germany; 50Hertz separately reports ~2% RMSE) - not a perfect match (MAE vs. stdev, wind-only vs. the whole MPVAR portfolio) but the best available real reference point; Mean left at 0.0, no real evidence found of systematic directional bias. Explicitly exploratory - not adopted. Germany2027_MarketCoupling_ROEFlex (Phase 37, no ForecastError) is kept fully unmodified as the comparison baseline."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

