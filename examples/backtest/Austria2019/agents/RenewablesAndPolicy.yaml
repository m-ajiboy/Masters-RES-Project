Agents:
  - Type: NoSupportTrader
    Id: 12
    Attributes:
      ShareOfRevenues: 0.0

  - Type: SystemOperatorTrader
    Id: 13

  - Type: SupportPolicy
    Id: 90
    Attributes:
      SetSupportData:
        - PolicySet: PVRooftop
          FIT:
            TsFit: 76.7
        - PolicySet: WindOn
          FIT:
            TsFit: 81.2

  - Type: VariableRenewableOperator
    Id: 10
    Attributes:
      PolicySet: PVRooftop
      EnergyCarrier: PV
      SupportInstrument: FIT
      InstalledPowerInMW: 1193
      OpexVarInEURperMWH: 0.0
