Metadata:
  runId: "Germany2027_LigniteMarkupTest_m40"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - LIGNITE-MARKUP SWEEP POINT (-40 EUR/MWh), built on top of Germany2027_Feb29DropFix. Part of a 3-point sweep alongside Germany2027_LigniteMarkupTest (-20) and Germany2027_LigniteMarkupTest_m10 (-10), following up the -20 result (negative-hour frequency and bias both improved slightly, all-hours correlation slightly worsened - a small net wash, not a clean win). See Germany2027_LigniteMarkupTest's scenario.yaml for the full rationale and sourcing. Only lignite's ConventionalTrader minMarkup changes (1001: -60 to -40); every other mechanism is unchanged from Germany2027_Feb29DropFix."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

