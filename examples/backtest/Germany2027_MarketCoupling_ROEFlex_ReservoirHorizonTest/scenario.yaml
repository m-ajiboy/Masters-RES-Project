Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex_ReservoirHorizonTest"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - an EXPLORATORY SENSITIVITY TEST on top of the standing-best Germany2027_MarketCoupling_ROEFlex (Phase 37), changing exactly ONE thing: ROE Reservoir Hydro's Bidding.SchedulingHorizonInHours reduced from 168 (1 week, every prior build) to 48 (2 days). Motivated by a direct investigation of the baseline's own 7 real shortage hours: on 2027-12-17 06:00-08:00 (3 of the 7), Reservoir Hydro had 655K-668K MWh real stored energy and a huge real price gap (DE heading to 3,000 EUR/MWh vs ROE at ~163) but discharged ZERO MWh at 06:00, despite the transmission ceiling NOT being reached (real spare capacity unused that hour) - ruling out the transmission constraint as the cause for these specific 3 hours. Testing whether a shorter, more reactive scheduling horizon lets Reservoir Hydro respond to short, sharp scarcity spikes that its longer 1-week horizon may be smoothing over. Explicitly exploratory, aimed specifically at reducing the physical shortage-hour count (not just changing how shortage-hour prices are displayed) - not adopted. Germany2027_MarketCoupling_ROEFlex (Phase 37, SchedulingHorizonInHours=168) is kept fully unmodified as the comparison baseline."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

Schema: !include "schema.yaml"

