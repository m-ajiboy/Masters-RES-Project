Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex_DecayTest"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - an EXPLORATORY SENSITIVITY TEST on top of the standing-best Germany2027_MarketCoupling_ROEFlex (Phase 37), changing exactly ONE thing: the SensitivityForecaster's MultiplierEstimation.DecayInterval reduced from 168 (1 week, every prior build) to 24 (1 day). Confirmed directly in AMIRIS's own source (FlexibilityAssessor.java): this controls how fast the forecaster discounts older observations of each flexible agent's historical dispatch share when forecasting future prices for bidding purposes - a real, documented mechanism, not an arbitrary constant, and a real, plausible alternative given storage dispatch cycles typically operate on daily rather than weekly timescales. Explicitly exploratory, testing whether a real alternative AMIRIS forecaster setting changes the picture - not adopted. Germany2027_MarketCoupling_ROEFlex (Phase 37, DecayInterval=168) is kept fully unmodified as the comparison baseline."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

Schema: !include "schema.yaml"

GeneralProperties:
  RunId: 1
  Simulation:
    StartTime: 2026-12-31_23:58:00
    StopTime: 2027-12-31_23:58:00
    RandomSeed: 1

