Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex_Demand2025"
  description: "Demand-shape-year sensitivity test on top of Germany2027_MarketCoupling_ROEFlex (Phase 37, the project's standing best result). Motivation: Phase 17 chose real 2016 German load data as the source shape for the inflexible-base demand component, on the grounds that 2016's real temperature was the closest available match to Brainpool's own real 2009 weather basis (monthly RMSE 2.31C) among 2015-2019/2023. An extended real-temperature search (compare_candidate_years_to_2009_extended.py) covering 2010-2014/2020-2025 found two years with a closer real match: 2011 (RMSE 1.78C, real load data not practically accessible - sits in ENTSO-E's decommissioned pre-2015 legacy archive, whose current URL could not be located) and 2025 (RMSE 2.11C, real load data fetched directly via the same ENTSO-E API already used for 2023). This build isolates demand-shape-year as the ONLY variable versus Phase 37: real 2025 ENTSO-E DE_LU load data replaces real 2016 AMIRIS-example load data as the inflexible-base shape, weekday-aligned (2025-01-01 Wed -> 2027-01-01 Fri, 2-day roll) and rescaled to the exact same real target total (604.8502088984375 TWh) Phase 37 uses. Heat-pump demand (real 2009 temperature), electrolysis, e-mobility, the ROE zone, transmission capacity, storage, and subsidy levels are all completely unchanged from Phase 37. See build_demand_2025_shape.py and compare_candidate_years_to_2009_extended.py for the full method.

  ORIGINAL PHASE 37 DESCRIPTION (unchanged below, for full context): AMIRIS scenario for German day-ahead electricity market in 2027 - the THIRD MARKET-COUPLING BUILD (Phase 37), built on top of Germany2027_MarketCoupling_RealFlow (Phase 36). Phase 36 found real, tighter transmission limits exposed that the Rest-of-Europe (ROE) zone had no storage/flexibility of its own to help smooth Germany's scarcity hours (shortage hours jumped 1 to 26) - this build addresses that directly with two real, sourced additions. (1) STORAGE: split ROE's real Hydro_total (110,769.3 MW, 10 countries, Phase 33/35) into a genuinely dispatchable component using a real EU-wide reference (30% pumped storage, 46/153 GW, IHA 2023 'EU report details importance of hydropower and pumped storage') and Switzerland's real ENTSO-E reservoir:run-of-river ratio (90.2%:9.8%, the only real per-technology data point available for this aggregate) - yielding two new GenericFlexibilityTrader agents (ROE Pumped Storage 33,303.2 MW, ROE Reservoir Hydro 69,904.1 MW), with duration/efficiency/charge-discharge ratios reused from Germany's own real, calibrated pumped-hydro and reservoir-hydro figures as technology characteristics. Only run-of-river (7,562.1 MW) remains a flat-capacity-factor VariableRenewableOperator. (2) SUBSIDY: replaced the flat zero-FIT NoSupportTrader used in Phases 34-36 with a genuine RenewableTrader + MPVAR SupportPolicy, using Germany's own real BNetzA-auction-sourced 2026 support levels (52 EUR/MWh wind onshore, reused for offshore since no separate figure was researched; 49 EUR/MWh solar) as the best available real EU reference point - not a per-country subsidy model, a documented simplification. See compute_roe_storage_split.py for the full calculation. Every other mechanism (ROE's demand, capacity, renewable yield profiles, fuel prices, the Phase 36 real-flow transmission capacity, and every DE-zone mechanism) is unchanged. Germany2027_MarketCoupling_RealFlow (Phase 36), Germany2027_MarketCoupling (Phase 34, placeholder-based), and Germany2027_Feb29DropFix (pre-coupling baseline) are all kept fully unmodified for comparison."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

