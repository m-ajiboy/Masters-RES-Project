Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex_LastSupplyPrice"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - an EXPLORATORY SENSITIVITY TEST on top of the standing-best Germany2027_MarketCoupling_ROEFlex (Phase 37), changing exactly ONE thing: ShortagePriceMethod set to LastSupplyPrice (both DE and ROE zones) instead of AMIRIS's default ValueOfLostLoad. Under the default (used in every prior build in this project), a shortage hour's price is capped at the DemandTrader's own VoLL (3,000 EUR/MWh). Under LastSupplyPrice, confirmed directly in AMIRIS's own source (MarketClearing.java), the price is instead capped at the highest REAL supply bid's own offer price - a genuine, documented alternative shortage-pricing convention, not an arbitrary tuned constant. Motivation: this project has repeatedly found that the artificial VoLL spike distorts the all-hours correlation metric as an outlier (Phases 25-31, 36, 44 all note this). Explicitly exploratory - testing whether a real, alternative AMIRIS mechanism changes the picture, not yet adopted as a methodology change. Germany2027_MarketCoupling_ROEFlex (Phase 37, default ShortagePriceMethod) is kept fully unmodified as the comparison baseline."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

