Agents:
  # Austria's own dedicated SupportPolicy - NOT shared with any other zone
  # (confirmed required directly in Phase 42: a shared SupportPolicy crashes once more than
  # one zone's exchange sends it Awards).
  - Type: SupportPolicy
    Id: 3090
    Attributes:
      SetSupportData:
        - PolicySet: ROE_WindOnMpvar
          MPVAR:
            Lcoe: 52.0
        - PolicySet: ROE_WindOffMpvar
          MPVAR:
            Lcoe: 52.0
        - PolicySet: ROE_SolarMpvar
          MPVAR:
            Lcoe: 49.0
        - PolicySet: Undefined
          FIT:
            TsFit: 0.0

  - Type: VariableRenewableOperator
    Id: 3401
    Attributes:
      PolicySet: ROE_WindOnMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: WindOn
      InstalledPowerInMW: 3896.294
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/wind_onshore_profile_at_2027.csv" 

  - Type: VariableRenewableOperator
    Id: 3403
    Attributes:
      PolicySet: ROE_SolarMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: PV
      InstalledPowerInMW: 6888.54
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/solar_profile_at_2027.csv" 

  - Type: VariableRenewableOperator
    Id: 3404
    Attributes:
      PolicySet: Undefined
      SupportInstrument: FIT
      EnergyCarrier: RunOfRiver
      InstalledPowerInMW: 1025.71
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/hydro_profile_restofeurope_FLAT.csv" 

  - Type: RenewableTrader
    Id: 3011
    Attributes:
      ShareOfRevenues: 0.0

  - Type: SystemOperatorTrader
    Id: 3013
