Agents:
  # Belgium's own dedicated SupportPolicy - NOT shared with any other zone
  # (confirmed required directly in Phase 42: a shared SupportPolicy crashes once more than
  # one zone's exchange sends it Awards).
  - Type: SupportPolicy
    Id: 4090
    Attributes:
      SetSupportData:
        - PolicySet: ROE_WindOnMpvar
          MPVAR:
            Lcoe: 52.0
        - PolicySet: ROE_WindOffMpvar
          MPVAR:
            Lcoe: 52.0
        - PolicySet: ROE_SolarMpvar
          MPVAR:
            Lcoe: 49.0
        - PolicySet: Undefined
          FIT:
            TsFit: 0.0

  - Type: VariableRenewableOperator
    Id: 4401
    Attributes:
      PolicySet: ROE_WindOnMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: WindOn
      InstalledPowerInMW: 3192.2
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/wind_onshore_profile_be_2027.csv" 

  - Type: VariableRenewableOperator
    Id: 4402
    Attributes:
      PolicySet: ROE_WindOffMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: WindOff
      InstalledPowerInMW: 2261.8
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/wind_offshore_profile_be_2027.csv" 

  - Type: VariableRenewableOperator
    Id: 4403
    Attributes:
      PolicySet: ROE_SolarMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: PV
      InstalledPowerInMW: 8360.4
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/solar_profile_be_2027.csv" 

  - Type: VariableRenewableOperator
    Id: 4404
    Attributes:
      PolicySet: Undefined
      SupportInstrument: FIT
      EnergyCarrier: RunOfRiver
      InstalledPowerInMW: 98.04
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/hydro_profile_restofeurope_FLAT.csv" 

  - Type: RenewableTrader
    Id: 4011
    Attributes:
      ShareOfRevenues: 0.0

  - Type: SystemOperatorTrader
    Id: 4013
