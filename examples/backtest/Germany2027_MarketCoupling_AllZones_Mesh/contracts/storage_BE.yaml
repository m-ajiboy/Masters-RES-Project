  - SenderId: *forecaster
    ReceiverId: *storage
    ProductName: SensitivityForecast
    FirstDeliveryTime: -19
    Every: 1 hour

  - SenderId: *storage
    ReceiverId: *forecaster
    ProductName: NetAward
    FirstDeliveryTime: 6
    Every: 1 hour

  - SenderId: *exchange
