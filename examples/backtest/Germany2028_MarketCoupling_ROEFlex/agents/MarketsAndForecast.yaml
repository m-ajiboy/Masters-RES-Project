Agents:
  #############################################
  # Zone DE (Germany) - converted from single-zone to multi-zone, coupled to ROE (Phase 38)
  #############################################
  # Transmission capacity: real-flow-derived (Phase 35/36), frozen at the same real 2023
  # ENTSO-E-sourced MW value used for 2027 (Phase 37) - see build_restofeurope_yeardata.py
  # for the documented rationale (no future-year real transfer-capacity data exists).
  - Type: DayAheadMarketMultiZone
    Id: 1
    Attributes:
      Clearing: &clearingParameters
        DistributionMethod: SAME_SHARES
      GateClosureInfoOffsetInSeconds: 31
      MarketZone: DE
      Transmission:
        - MarketZone: ROE
          CapacityInMW: "./timeseries/transfer_DEtoROE_realflow_2028.csv"

  - Type: CarbonMarket
    Id: 3
    Attributes:
      OperationMode: FIXED
      Co2Prices: "./timeseries/co2_price.csv"

  # Sources: LIGNITE and NUCLEAR fuel costs are AMIRIS's own flat estimates (Nuclear is moot
  # - 0 GW capacity). Hard coal / natural gas / oil: built from Brainpool's Variable_cost
  # sheet with unit conversions - see build_2028_timeseries.py.
  - Type: FuelsMarket
    Id: 4
    Attributes:
      FuelPrices:
        - FuelType: LIGNITE
          Price: 5.00
          ConversionFactor: 1.0
        - FuelType: HARD_COAL
          Price: "./timeseries/hard_coal_price.csv"
          ConversionFactor: 1.0
        - FuelType: NATURAL_GAS
          Price: "./timeseries/natural_gas_price.csv"
          ConversionFactor: 1.0
        - FuelType: OIL
          Price: "./timeseries/oil_price.csv"
          ConversionFactor: 1.0

  - Type: SensitivityForecaster
    Id: 6
    Attributes:
      Clearing: *clearingParameters
      ForecastPeriodInHours: 730
      MultiplierEstimation:
        InitialEstimateWeight: 6
        DecayInterval: 168

  #############################################
  # Zone ROE (Rest of Europe, aggregate) - economic size frozen at real 2023 levels
  #############################################
  - Type: DayAheadMarketMultiZone
    Id: 9001
    Attributes:
      Clearing:
        DistributionMethod: SAME_SHARES
      GateClosureInfoOffsetInSeconds: 31
      MarketZone: ROE
      Transmission:
        - MarketZone: DE
          CapacityInMW: "./timeseries/transfer_ROEtoDE_realflow_2028.csv"

  # ROE's own fuel prices - HARD_COAL/NATURAL_GAS/OIL now reused from DE's OWN REAL 2028
  # series (internationally-traded commodities, real Brainpool 2028 values - not the 2027
  # values); NUCLEAR unchanged flat 5.0 (real 2023 NEI/EUCG figure, frozen).
  - Type: FuelsMarket
    Id: 9004
    Attributes:
      FuelPrices:
        - FuelType: NUCLEAR
          Price: 5.00
          ConversionFactor: 1.0
        - FuelType: HARD_COAL
          Price: "./timeseries/hard_coal_price_restofeurope_2028.csv"
          ConversionFactor: 1.0
        - FuelType: NATURAL_GAS
          Price: "./timeseries/natural_gas_price_restofeurope_2028.csv"
          ConversionFactor: 1.0
        - FuelType: OIL
          Price: "./timeseries/oil_price_restofeurope_2028.csv"
          ConversionFactor: 1.0

  # ROE's own dedicated SensitivityForecaster (required since ROE has its own storage
  # agents - see Phase 37 for why a shared forecaster crashes).
  - Type: SensitivityForecaster
    Id: 9006
    Attributes:
      Clearing:
        DistributionMethod: SAME_SHARES
      ForecastPeriodInHours: 730
      MultiplierEstimation:
        InitialEstimateWeight: 6
        DecayInterval: 168

  #############################################
  # Market Coupling coordinator
  #############################################
  - Type: MarketCoupling
    Id: 9099
