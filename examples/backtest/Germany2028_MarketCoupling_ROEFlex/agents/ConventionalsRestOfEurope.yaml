Variables:
  - &portfolioBuildingOffset 60

Agents:
  # Coal (Eurostat 'Coal_and_manufactured_gases', 29,855 MW, dominated by Poland's 27,017 MW)
  # - lignite/hard-coal split not available at this data granularity (see
  # RestOfEurope2023/fuel_prices_plan.json), so modelled as one HARD_COAL block using the
  # same real efficiency/markup/CO2-factor assumptions as DE's own hard coal fleet.
  - Type: PredefinedPlantBuilder
    Id: 9101
    Attributes:
      PortfolioBuildingOffsetInSeconds: *portfolioBuildingOffset
      Prototype:
        FuelType: HARD_COAL
        SpecificCo2EmissionsInTperMWH: 0.338
        OutageFactor: 0.05
        OpexVarInEURperMWH: 2.5
        CyclingCostInEURperMW: 0.0
      Efficiency:
        Minimal: 0.339
        Maximal: 0.492
      BlockSizeInMW: 300.0
      InstalledPowerInMW: 29855.053

  # Natural Gas (Eurostat, 43,509 MW) - same real efficiency/markup/CO2-factor assumptions
  # as DE's own gas fleet.
  - Type: PredefinedPlantBuilder
    Id: 9102
    Attributes:
      PortfolioBuildingOffsetInSeconds: *portfolioBuildingOffset
      Prototype:
        FuelType: NATURAL_GAS
        SpecificCo2EmissionsInTperMWH: 0.202
        OutageFactor: 0.05
        OpexVarInEURperMWH: 1.2
        CyclingCostInEURperMW: 0.0
      Efficiency:
        Minimal: 0.516
        Maximal: 0.617
      BlockSizeInMW: 200.0
      InstalledPowerInMW: 43509.266

  # Oil (Eurostat, 9,008 MW) - same real efficiency/markup/CO2-factor assumptions as DE's
  # own oil fleet.
  - Type: PredefinedPlantBuilder
    Id: 9103
    Attributes:
      PortfolioBuildingOffsetInSeconds: *portfolioBuildingOffset
      Prototype:
        FuelType: OIL
        SpecificCo2EmissionsInTperMWH: 0.266
        OutageFactor: 0.07
        OpexVarInEURperMWH: 1.2
        CyclingCostInEURperMW: 0.0
      Efficiency:
        Minimal: 0.311
        Maximal: 0.397
      BlockSizeInMW: 100.0
      InstalledPowerInMW: 9008.126

  # Nuclear (Eurostat, 77,131 MW - dominated by France's 61,400 MW) - new for this project
  # (DE has 0 GW, post phase-out). Efficiency: typical real-world thermal efficiency for
  # light-water reactors (~33%, well-documented industry figure), used here as a documented
  # placeholder since no plant-level technical data was researched. Narrow markup band:
  # nuclear plants are effectively baseload/must-run with limited real operating
  # flexibility - a conservative simplification, not researched per-plant.
  - Type: PredefinedPlantBuilder
    Id: 9104
    Attributes:
      PortfolioBuildingOffsetInSeconds: *portfolioBuildingOffset
      Prototype:
        FuelType: NUCLEAR
        SpecificCo2EmissionsInTperMWH: 0.0
        OutageFactor: 0.10
        OpexVarInEURperMWH: 3.0
        CyclingCostInEURperMW: 0.0
      Efficiency:
        Minimal: 0.33
        Maximal: 0.33
      BlockSizeInMW: 1000.0
      InstalledPowerInMW: 77131.0

  - Type: ConventionalTrader # HARD_COAL (ROE)
    Id: 9201
    Attributes:
      minMarkup: -15
      maxMarkup: 5
  - Type: ConventionalTrader # NATURAL_GAS (ROE)
    Id: 9202
    Attributes:
      minMarkup: -10
      maxMarkup: 10
  - Type: ConventionalTrader # OIL (ROE)
    Id: 9203
    Attributes:
      minMarkup: 0
      maxMarkup: 0
  - Type: ConventionalTrader # NUCLEAR (ROE)
    Id: 9204
    Attributes:
      minMarkup: -5
      maxMarkup: 0

  - Type: ConventionalPlantOperator # HARD_COAL (ROE)
    Id: 9301
  - Type: ConventionalPlantOperator # NATURAL_GAS (ROE)
    Id: 9302
  - Type: ConventionalPlantOperator # OIL (ROE)
    Id: 9303
  - Type: ConventionalPlantOperator # NUCLEAR (ROE)
    Id: 9304
