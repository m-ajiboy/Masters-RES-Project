Agents:
  # ROE Pumped Storage (Phase 37) - 33,303.20 MW. Split out of the real Eurostat+ENTSO-E
  # Hydro_total (110,769.3 MW, 10 countries) using the real EU-wide pumped-storage share
  # (30%, 46 GW PSH / 153 GW total EU hydro, IHA 2023 "EU report details importance of
  # hydropower and pumped storage"). Duration (6.3989h), efficiency (0.875/0.852), and the
  # charge/discharge power ratio all REUSE Germany's own real, already-calibrated pumped-
  # hydro figures as technology characteristics (engineering properties reasonably similar
  # across countries, unlike demand or capacity, which are genuinely national) - the same
  # category of reuse already applied to internationally-traded fuel prices. See
  # compute_roe_storage_split.py for the full calculation.
  # Exploratory sensitivity test (not adopted): Bidding.SchedulingHorizonInHours widened from
  # 24 (every prior build) to 168 (1 week), matching this same agent's own
  # StateDiscretisation.PlanningHorizonInHours (already 168) and Reservoir Hydro's ORIGINAL
  # scheduling horizon in Phase 37. Motivated by the same real finding behind the Reservoir
  # horizon test: Pumped Storage was found COMPLETELY DEPLETED (~0 MWh) during 2027-12-17
  # 06:00-08:00, 3 of the baseline's 7 shortage hours, with real spare transmission capacity
  # unused that hour - suggesting it may be spending its (real, physically small, 6.4h
  # duration) reserve too eagerly without enough foresight to hold some back for the known-
  # ahead price spike. Unlike the Reservoir test (which shortened an already-long horizon and
  # made things worse), this widens an unusually SHORT one - the opposite direction, testing
  # whether more foresight helps an inventory-management problem the way less foresight did
  # not.
  - Attributes:
      Assessment:
        Type: MIN_SYSTEM_COST
      Bidding:
        SchedulingHorizonInHours: 168
        Type: ENSURE_DISPATCH
      Device:
        ChargingEfficiency: 0.875
        DischargingEfficiency: 0.852
        EnergyContentUpperLimitInMWH: 213104.35
        GrossChargingPowerInMW: 33303.20
        InitialEnergyContentInMWH: 106552.18
        NetDischargingPowerInMW: 31638.04
      StateDiscretisation:
        EnergyResolutionInMWH: 6267.78
        PlanningHorizonInHours: 168
        Type: STATE_OF_CHARGE
    Id: 9601
    Type: GenericFlexibilityTrader

