Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex_PumpedHorizonTest"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - an EXPLORATORY SENSITIVITY TEST on top of the standing-best Germany2027_MarketCoupling_ROEFlex (Phase 37), changing exactly ONE thing: ROE Pumped Storage's Bidding.SchedulingHorizonInHours widened from 24 (every prior build) to 168 (1 week), matching this same agent's own StateDiscretisation.PlanningHorizonInHours (already 168) and Reservoir Hydro's original scheduling horizon. Motivated by the same real investigation behind the Reservoir horizon test: Pumped Storage was found completely depleted (~0 MWh) during 2027-12-17 06:00-08:00 (3 of the baseline's 7 shortage hours), with real spare transmission capacity unused that hour - suggesting it may spend its real, physically small (6.4-hour duration) reserve too eagerly without enough foresight to hold some back. Opposite direction from the Reservoir test (which shortened an already-long horizon and made things worse) - this widens an unusually short one, testing whether more foresight helps this inventory-management problem. Explicitly exploratory, aimed at reducing the physical shortage-hour count - not adopted. Germany2027_MarketCoupling_ROEFlex (Phase 37, SchedulingHorizonInHours=24) is kept fully unmodified as the comparison baseline."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

