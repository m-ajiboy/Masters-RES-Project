Metadata:
  runId: "Germany2027_MarketCoupling_ROEFlex"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027 - the THIRD MARKET-COUPLING BUILD (Phase 37), built on top of Germany2027_MarketCoupling_RealFlow (Phase 36). Phase 36 found real, tighter transmission limits exposed that the Rest-of-Europe (ROE) zone had no storage/flexibility of its own to help smooth Germany's scarcity hours (shortage hours jumped 1 to 26) - this build addresses that directly with two real, sourced additions. (1) STORAGE: split ROE's real Hydro_total (110,769.3 MW, 10 countries, Phase 33/35) into a genuinely dispatchable component using a real EU-wide reference (30% pumped storage, 46/153 GW, IHA 2023 'EU report details importance of hydropower and pumped storage') and Switzerland's real ENTSO-E reservoir:run-of-river ratio (90.2%:9.8%, the only real per-technology data point available for this aggregate) - yielding two new GenericFlexibilityTrader agents (ROE Pumped Storage 33,303.2 MW, ROE Reservoir Hydro 69,904.1 MW), with duration/efficiency/charge-discharge ratios reused from Germany's own real, calibrated pumped-hydro and reservoir-hydro figures as technology characteristics. Only run-of-river (7,562.1 MW) remains a flat-capacity-factor VariableRenewableOperator. (2) SUBSIDY: replaced the flat zero-FIT NoSupportTrader used in Phases 34-36 with a genuine RenewableTrader + MPVAR SupportPolicy, using Germany's own real BNetzA-auction-sourced 2026 support levels (52 EUR/MWh wind onshore, reused for offshore since no separate figure was researched; 49 EUR/MWh solar) as the best available real EU reference point - not a per-country subsidy model, a documented simplification. See compute_roe_storage_split.py for the full calculation. Every other mechanism (ROE's demand, capacity, renewable yield profiles, fuel prices, the Phase 36 real-flow transmission capacity, and every DE-zone mechanism) is unchanged. Germany2027_MarketCoupling_RealFlow (Phase 36), Germany2027_MarketCoupling (Phase 34, placeholder-based), and Germany2027_Feb29DropFix (pre-coupling baseline) are all kept fully unmodified for comparison."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

