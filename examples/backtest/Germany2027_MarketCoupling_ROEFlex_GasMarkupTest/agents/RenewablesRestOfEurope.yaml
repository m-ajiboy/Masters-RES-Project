Agents:
  # Real subsidy realism (Phase 37): replaces the flat zero-FIT NoSupportTrader used in
  # Phase 34-36 with a genuine RenewableTrader + MPVAR SupportPolicy, using Germany's own
  # real, BNetzA-auction-sourced 2026 support levels as the best available real EU reference
  # point (no separate per-country ROE subsidy scheme was researched for 9 countries - this
  # is a documented, real-grounded simplification, not a per-country subsidy model).
  - Type: RenewableTrader
    Id: 9011
    Attributes:
      ShareOfRevenues: 0.0

  # SystemOperatorTrader for FIT-marketed renewables (run-of-river, 9404 below) - mirrors
  # DE's own split (RenewableTrader for MPVAR, SystemOperatorTrader for FIT). Confirmed
  # required directly: RenewableTrader threw 'not configured for support instrument: FIT'
  # when run-of-river was first attached to it.
  - Type: SystemOperatorTrader
    Id: 9013

  - Type: SupportPolicy
    Id: 9090
    Attributes:
      SetSupportData:
        - PolicySet: ROE_WindOnMpvar
          MPVAR:
            Lcoe: 52.0   # EUR/MWh - reused from Germany's own real BNetzA wind-onshore
                         # auction trend (Feb-Aug 2026 rounds), the best available real EU
                         # reference point for this aggregate zone.
        - PolicySet: ROE_WindOffMpvar
          MPVAR:
            Lcoe: 52.0   # EUR/MWh - no separate real offshore figure researched for ROE;
                         # reused from the onshore value as a documented placeholder (unlike
                         # DE's own offshore, which has its own dedicated - if also
                         # placeholder - LCOE).
        - PolicySet: ROE_SolarMpvar
          MPVAR:
            Lcoe: 49.0   # EUR/MWh - reused from Germany's own real BNetzA solar-openfield
                         # auction (March 2026 round, volume-weighted award value).
        - PolicySet: Undefined
          FIT:
            TsFit: 0.0   # unsubsidised - used by run-of-river hydro below (9404).

  # Wind onshore - 70,993 MW (real Eurostat 2023, 9 countries). Yield profile: real 2009
  # weather (renewables.ninja), capacity-weighted blend across the 9 countries (Phase 33).
  - Type: VariableRenewableOperator
    Id: 9401
    Attributes:
      PolicySet: ROE_WindOnMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: WindOn
      InstalledPowerInMW: 70993.096
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/wind_onshore_profile_restofeurope_2027.csv"

  # Wind offshore - 10,520 MW (real Eurostat 2023, 5 countries with real offshore capacity).
  - Type: VariableRenewableOperator
    Id: 9402
    Attributes:
      PolicySet: ROE_WindOffMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: WindOff
      InstalledPowerInMW: 10519.9
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/wind_offshore_profile_restofeurope_2027.csv"

  # Solar PV - 83,421 MW (real Eurostat 2023, 9 countries; openfield/rooftop not split at
  # this data granularity, modelled as one combined PV category).
  - Type: VariableRenewableOperator
    Id: 9403
    Attributes:
      PolicySet: ROE_SolarMpvar
      SupportInstrument: MPVAR
      EnergyCarrier: PV
      InstalledPowerInMW: 83421.005
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/solar_profile_restofeurope_2027.csv"

  # Run-of-river hydro ONLY (Phase 37) - 7,562.1 MW. Split out of the real Eurostat+ENTSO-E
  # Hydro_total (110,769.3 MW, 10 countries) using a real EU-wide pumped-storage share (30%,
  # 46/153 GW, IHA 2023) plus Switzerland's real ENTSO-E reservoir:run-of-river ratio
  # (90.2%:9.8%) as the only real per-technology reference point available for this
  # aggregate. The dispatchable remainder (pumped storage + reservoir) is now modelled as
  # real GenericFlexibilityTrader agents - see StorageRestOfEurope.yaml. Still a flat 40%
  # capacity-factor placeholder for the profile itself (Eurostat gives no real weather-driven
  # run-of-river shape) - unchanged from Phase 34.
  - Type: VariableRenewableOperator
    Id: 9404
    Attributes:
      PolicySet: Undefined
      SupportInstrument: FIT
      EnergyCarrier: RunOfRiver
      InstalledPowerInMW: 7562.1
      OpexVarInEURperMWH: 0.0
      YieldProfile: "./timeseries/hydro_profile_restofeurope_FLAT.csv"
