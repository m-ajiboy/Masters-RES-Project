Metadata:
  runId: "Germany2027_WithImport"
  description: "AMIRIS scenario for German day-ahead electricity market in 2027, built from Energy Brainpool 2027 input data plus documented AMIRIS-own/EEG-researched gap-fills (see build_2027_*.py). With-import version: adds an ImportTrader (agents/Import.yaml) offering Brainpool's 43.90 TWh net-import target into the day-ahead market, shaped by real 2023 net cross-border flow timing (clipped to import hours, rescaled) and priced at real 2023 French day-ahead prices as an import-cost proxy (see build_2027_import.py). Exports are not modelled (no ExportTrader exists for a single, uncoupled market zone) - this variant captures only the import side of cross-border trade. Demand V2: component-split build - inflexible base rescaled from real 2023 ENTSO-E load shape, heat pumps from demandlib's BDEW HeatBuilding profile (DWD TRY temperature data), electrolysis flat, e-mobility an assumed evening-peaked daily shape (see build_2027_demand_v2_split.py)."
  url: "https://gitlab.com/dlr-ve/esy/amiris/examples/"
  version: "7.0.0"
  amirisVersion: "4.1.0"
  output:
    publicationDate: "2026-08-10"
    embargoPeriod: None
    licenses: "CC-BY 4.0"

Schema: !include "schema.yaml"

GeneralProperties:
  RunId: 1
  Simulation:
    StartTime: 2026-12-31_23:58:00
    StopTime: 2027-12-31_23:58:00
    RandomSeed: 1

Agents: !include ["agents/*.yaml", "Agents"]

Contracts: !include ["contracts/*.yaml", "Contracts"]

StringSets:
  FuelType:
    Values:
      OIL:
        MetaData:
          Description: "Fuel type oil (combined with 'Other Fossil' for Germany2027)"
          OEONearestConcept: OEO_00010316
      HARD_COAL:
        MetaData:
          Description: "Fuel type hard coal"
          OEONearestConcept: OEO_00000204
      LIGNITE:
        MetaData:
          Description: "Fuel type lignite"
          OEONearestConcept: OEO_00000251
      NUCLEAR:
        MetaData:
          Description: "Fuel type nuclear (unused in Germany2027 - 0 GW post phase-out)"
          OEONearestConcept: OEO_00000302
      WASTE:
        MetaData:
          Description: "Fuel type waste"
          OEONearestConcept: OEO_00000439
      NATURAL_GAS:
        MetaData:
          Description: "Fuel type natural gas (CCGT+OCGT combined for Germany2027)"
          OEONearestConcept: OEO_00000292
      HYDROGEN:
        MetaData:
          Description: "Fuel type hydrogen gas"
      BIOMASS:
        MetaData:
          Description: "Fuel type biogas or other bio-fuels"
      OTHER:
