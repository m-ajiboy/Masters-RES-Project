AgentGroups:
  - &exchange 1
  - &carbonMarket 3
  - &fuelsMarket 4  
  - &builders  [2004]
  - &traders   [1004]
  - &operators [504]

Contracts:
#################################
# -- PlantBuildingManagement -- #
#################################
